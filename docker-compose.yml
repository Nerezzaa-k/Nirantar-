version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nirantar_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nirantar

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nirantar_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-nirantar_internal_ai_secret_token_789456}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nirantar_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/nirantar}
      - JWT_SECRET=${JWT_SECRET:-nirantar_production_jwt_secret_key_2026}
      - FRONTEND_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-nirantar_internal_ai_secret_token_789456}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nirantar_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
